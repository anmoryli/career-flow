<div class="studio-design-panel" data-design-panel="colors" hidden><h3>简历主题色</h3><p>调整标题与细节的强调色，预览和 PDF 使用同一套设置。</p><div class="studio-design-colors"><button type="button" data-design-accent="green" aria-pressed="false"><i class="accent-green"></i>深绿</button><button type="button" data-design-accent="navy" aria-pressed="false"><i class="accent-navy"></i>深蓝</button><button type="button" data-design-accent="graphite" aria-pressed="false"><i class="accent-graphite"></i>石墨灰</button></div></div>
<div class="studio-design-panel" data-design-panel="spacing" hidden><h3>内容疏密</h3><p>字号与留白随版式一起调整。内容较多时选择紧凑，预览中仍需检查可读性。</p><div class="studio-design-sizes"><button type="button" data-design-size="compact" aria-pressed="false"><span>紧凑</span><small>更多内容，较紧凑的字号</small></button><button type="button" data-design-size="standard" aria-pressed="true"><span>标准</span><small>均衡的字号与阅读节奏</small></button><button type="button" data-design-size="large" aria-pressed="false"><span>宽松</span><small>较大的字号与更多留白</small></button></div></div>
