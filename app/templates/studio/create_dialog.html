<dialog class="studio-dialog studio-create-dialog" data-create-dialog aria-labelledby="studio-create-title"><button class="studio-dialog-close" type="button" data-studio-close aria-label="关闭">×</button><header><span class="page-kicker">准备你的下一份机会</span><h2 id="studio-create-title">创建简历</h2></header><div class="studio-dialog-tabs" role="group" aria-label="创建方式"><button type="button" data-create-mode="blank" aria-pressed="true">空白简历</button><button type="button" data-create-mode="paste" aria-pressed="false">粘贴文本</button><a href="{{ url_for('web.workspace', view='resume-import') }}">导入 PDF {{ icon('arrow') }}</a></div><form data-create-form data-ui-form="create"><label>简历名称<input name="title" maxlength="120" required placeholder="例如：产品经理 · 基础简历" value="未命名简历"></label><label data-create-source hidden>简历原文<textarea name="source" rows="8" maxlength="12000" placeholder="粘贴至少 20 字真实经历。AI 将整理为草稿，由你核对后采用。"></textarea></label><label>起始模板<select name="template"><option value="classic">经典商务</option><option value="technical">技术项目</option><option value="modern">简约现代</option></select></label><p class="studio-create-hint" data-create-hint>从空白字段开始填写，预览中的模板示例不会保存到你的简历。</p><button class="button" type="submit" data-create-submit>进入编辑器 {{ icon('arrow') }}</button></form></dialog>
