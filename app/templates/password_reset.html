{% extends 'base.html' %}
{% block title %}找回密码 · 职序{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>找回密码</h1><p>通过注册邮箱验证身份，重新设置登录密码。</p></div>
  <div class="auth-form">
    <h2>先获取验证码</h2><p class="muted">验证码 10 分钟内有效。如果邮箱已有账号，我们会发送邮件。</p>
    <form action="{{ url_for('web.password_reset_code') }}" method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="reset-email">注册邮箱</label><input id="reset-email" name="email" type="email" autocomplete="email" required maxlength="254"><button class="button secondary" type="submit">发送验证码</button></form>
    <h2>设置新密码</h2>
    <form action="{{ url_for('web.password_reset_submit') }}" method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="confirm-email">注册邮箱</label><input id="confirm-email" name="email" type="email" autocomplete="email" required maxlength="254"><label for="reset-code">验证码</label><input id="reset-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><label for="new-password">新密码</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm-password">再次输入新密码</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button class="button" type="submit">验证并重置密码</button></form>
    <p class="auth-switch"><a href="{{ url_for('web.login') }}">返回登录</a></p>
  </div>
</section>
{% endblock %}
