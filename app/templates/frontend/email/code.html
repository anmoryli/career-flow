<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body style="margin:0;padding:32px 12px;background:#f4f7f4;color:#26352b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e5ebe5;border-radius:16px;overflow:hidden;">
      <tr>
        <td style="padding:26px 32px;border-bottom:1px solid #edf1ed;">
          <div style="font-size:15px;font-weight:700;letter-spacing:.04em;color:#315b42;">职序 <span style="font-weight:500;color:#78877c;">CareerFlow</span></div>
        </td>
      </tr>
      <tr>
        <td style="padding:34px 32px 30px;">
          <div style="font-size:12px;font-weight:700;letter-spacing:.12em;color:#64836d;">SECURE VERIFICATION</div>
          <h1 style="margin:12px 0 10px;font-size:24px;line-height:1.4;color:#26352b;">{{ purpose }}</h1>
          <p style="margin:0;color:#66736a;font-size:15px;line-height:1.8;">请使用下面的验证码继续操作。</p>
          <div style="margin:26px 0;padding:20px 16px;text-align:center;background:#f3f7f2;border:1px solid #e5eee3;border-radius:12px;color:#315b42;font-size:32px;font-weight:700;letter-spacing:.28em;">{{ code }}</div>
          <p style="margin:0;color:#66736a;font-size:14px;line-height:1.8;">验证码 <strong style="color:#39483d;">10 分钟内有效</strong>。{{ note }}</p>
          <p style="margin:18px 0 0;color:#8a948c;font-size:13px;line-height:1.7;">如果这不是您发起的操作，请忽略此邮件。请勿将验证码转发给他人。</p>
        </td>
      </tr>
      <tr>
        <td style="padding:18px 32px;background:#fafbfa;border-top:1px solid #edf1ed;color:#8a948c;font-size:12px;line-height:1.6;">职序 CareerFlow · 让每一步求职准备更清晰</td>
      </tr>
    </table>
  </body>
</html>
