<dialog class="cf-resume-dialog" id="cf-resume-create" data-create-dialog aria-labelledby="cf-create-title"><button class="cf-dialog-close" type="button" data-dialog-close aria-label="关闭">×</button><header><span class="cf-eyebrow">准备你的下一份机会</span><h2 id="cf-create-title">创建简历</h2></header><div class="cf-tabs cf-create-tabs" role="group" aria-label="创建方式"><button type="button" data-create-mode="blank" aria-pressed="true">空白简历</button><button type="button" data-create-mode="paste" aria-pressed="false">粘贴文本</button><a href="{{ url_for('web.workspace', view='resume-import') }}">导入 PDF →</a></div><form data-create-form><label class="cf-field">简历名称<input name="title" required maxlength="120" value="未命名简历"></label><label class="cf-field" data-create-source hidden>简历原文<textarea name="source" rows="8" maxlength="12000" placeholder="粘贴至少 20 字真实经历，AI 整理后由你核对。"></textarea></label><label class="cf-field">起始模板<select name="template">{% for item in resume_templates %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</select></label><p class="cf-create-hint" data-create-hint>从空白内容开始，模板示例不会保存进你的简历。</p><button type="submit" class="cf-button" data-create-submit>进入编辑器 →</button></form></dialog>
<dialog class="cf-resume-dialog" id="cf-resume-rename" data-library-rename-dialog aria-labelledby="cf-rename-title"><button class="cf-dialog-close" type="button" data-dialog-close aria-label="关闭">×</button><header><h2 id="cf-rename-title">重命名简历</h2><p>名称用于区分文档，不修改正文。</p></header><form data-library-rename-form><label class="cf-field">简历名称<input name="title" required maxlength="120"></label><p class="cf-feedback" data-library-operation-status role="status"></p><button type="submit" class="cf-button">保存名称</button></form></dialog>
<dialog class="cf-resume-dialog" id="cf-resume-delete" data-library-delete-dialog aria-labelledby="cf-delete-title"><button class="cf-dialog-close" type="button" data-dialog-close aria-label="关闭">×</button><header><h2 id="cf-delete-title">删除这份简历？</h2><p>将删除「<span data-library-delete-title></span>」，此操作无法撤销。</p></header><p class="cf-feedback" data-library-delete-status role="status"></p><div class="cf-resume-dialog-actions"><button type="button" class="cf-button is-secondary" data-dialog-close>保留简历</button><button type="button" class="cf-button is-danger" data-library-delete-confirm>确认删除</button></div></dialog>
