<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ version.title }} · PDF</title>{% for asset in ['tokens','components','document','resume'] %}<link rel="stylesheet" href="{{ url_for('static',filename='css/frontend/' ~ asset ~ '.css',v='20261029-refactor') }}">{% endfor %}<script src="{{ url_for('static',filename='js/frontend/resume-print.js',v='20261029-refactor') }}" defer></script></head><body class="cf-print-page"><div class="cf-print-actions"><div><strong>{{ version.title }}</strong><small>第 {{ version.revision }} 版 · 核对内容与分页后导出</small></div><button class="cf-button" type="button" id="print-document">打印 / 另存为 PDF</button><a class="cf-button is-secondary" href="{{ url_for('web.workspace',view='resume-new',resume_id=resume.id) }}">返回编辑</a></div>{% from 'resume/_document.html' import resume_document %}<div class="cf-print-canvas" data-resume-print='{{ version.document|tojson }}' data-template="{{ version.template }}"><div class="cf-resume-canvas" data-accent="{{ version.document.get('accent','default') }}">{{ resume_document(version.template,version.document,false) }}</div></div></body></html>
