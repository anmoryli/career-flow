<header class="cf-header" data-site-header>
<a class="cf-brand" href="{{ url_for('web.home') }}" aria-label="职序首页"><span class="cf-brand-mark">序</span><strong>职序 <small>CareerFlow</small></strong></a>
<nav class="cf-product-nav" aria-label="产品任务"><a href="{{ url_for('web.workspace',view='resume-new') }}">写一份简历</a><a href="{{ url_for('web.workspace',view='jobs') }}">准备一个岗位</a><details class="cf-task-menu"><summary>我的内容 {{ icon('chevron') }}</summary><div><a href="{{ url_for('web.workspace',view='resumes') }}">简历与版本</a><a href="{{ url_for('web.workspace',view='reports') }}">分析与报告</a><a href="{{ url_for('web.workspace',view='history') }}">准备记录</a><a href="{{ url_for('web.workspace',view='resume-template') }}">探索模板</a></div></details></nav>
<div class="cf-header-tools"><label class="cf-theme"><span class="sr-only">外观主题</span><select id="theme-select" aria-label="外观主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>{% if g.user %}<details class="cf-account-menu"><summary aria-label="账号菜单"><span class="cf-avatar">{{ g.user.display_name[:1] }}</span>{{ icon('chevron') }}</summary><div><header><strong>{{ g.user.display_name }}</strong><small>{{ g.user.email }}</small></header><a href="{{ url_for('web.workspace') }}">继续我的准备</a><a href="{{ url_for('web.workspace',view='settings') }}">账号与偏好</a><a href="{{ url_for('web.workspace',view='billing') }}">会员与权益</a>{% if g.user.is_admin %}<a href="{{ url_for('admin.dashboard') }}">产品管理</a>{% endif %}<form action="{{ url_for('web.logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">退出登录</button></form></div></details>{% else %}<a class="cf-login-link" href="{{ url_for('web.login') }}" data-auth-open="login">登录</a>{% endif %}</div>
</header>
