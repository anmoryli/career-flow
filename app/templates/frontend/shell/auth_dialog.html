<dialog id="auth-dialog" class="cf-dialog cf-auth-dialog" aria-labelledby="auth-dialog-title"><button class="cf-dialog-close" type="button" data-auth-close aria-label="关闭">×</button><header><span class="cf-eyebrow">CAREERFLOW / 你的求职工作空间</span><h2 id="auth-dialog-title">登录后继续</h2><p data-auth-description>填写内容会保留，登录后继续刚才的操作。</p></header><nav class="cf-tabs cf-auth-tabs" aria-label="登录与注册"><button type="button" data-auth-mode="login" aria-pressed="true">登录账号</button><button type="button" data-auth-mode="register" aria-pressed="false">创建账号</button></nav>
<form class="cf-stack" data-auth-modal-form="login" data-ui-form="auth-modal"><p class="cf-feedback" data-auth-feedback role="alert" hidden></p><label class="cf-field">邮箱<input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></label><label class="cf-field">密码<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="current-password"></label><a class="cf-link" href="{{ url_for('web.password_reset_page') }}">忘记密码</a><button class="cf-button is-wide" type="submit">登录并继续 {{ icon('arrow') }}</button></form>
<form class="cf-stack" data-auth-modal-form="register" data-ui-form="auth-modal" hidden><p class="cf-feedback" data-auth-feedback role="alert" hidden></p><label class="cf-field">称呼<input name="display_name" required maxlength="80" autocomplete="nickname" placeholder="希望如何称呼你"></label><label class="cf-field">邮箱<input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></label><div class="cf-auth-code"><label class="cf-field">验证码<input name="code" pattern="[0-9]{6}" maxlength="6" required inputmode="numeric" autocomplete="one-time-code" placeholder="六位数字"></label><button class="cf-button is-secondary" type="button" data-auth-send-code>发送验证码</button></div><label class="cf-field">密码<input name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password" placeholder="12–128 个字符"></label><button class="cf-button is-wide" type="submit">验证并创建账号 {{ icon('arrow') }}</button></form></dialog>
