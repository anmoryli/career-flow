<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ version.title }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"><script src="{{ url_for('static', filename='js/resume_print.js') }}" defer></script><script src="{{ url_for('static', filename='js/print.js', v='20261026-hide-empty-resume-links') }}" defer></script></head>
<body class="resume-print-page" data-hidden-sections='{{ version.document.get("hidden_sections", [])|tojson }}'>{% from 'resume/_document.html' import resume_document %}<div class="print-actions"><button class="button" type="button" id="print-document">打印 / 另存为 PDF</button><a href="{{ url_for('web.workspace', view='resume-new', resume_id=resume.id) }}">返回编辑</a><p>第 {{ version.revision }} 版 · 请检查分页、联系方式及内容是否完整。</p></div><div class="resume-stage print-stage" data-size="{{ version.document.get('size', 'standard') }}" data-accent="{{ version.document.get('accent', 'default') }}" data-photo-position="{{ version.document.get('photo_position', 'center') }}"><div class="resume-panel">{{ resume_document(version.template, version.document, false) }}</div></div></body></html>
