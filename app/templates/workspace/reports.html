<section class="business-page-heading"><div><h1>诊断与报告</h1><p>查看要求、真实证据和可执行的修改建议。</p></div><a class="button" href="{{ url_for('web.workspace', view='jobs') }}">分析目标岗位</a></section>
<section class="list-surface">{% for operation, diagnostic in reports %}<article class="recent-row"><div class="recent-record-copy"><strong>报告 #{{ operation.id }}</strong><small>{{ operation.created_at.strftime('%Y-%m-%d %H:%M') }} UTC · 已结算 {{ operation.charged }} 积分</small></div><a href="{{ url_for('diagnosis.detail', job_id=diagnostic.job_id) }}">查看证据与建议</a></article>{% else %}<div class="workspace-empty"><h2>完成诊断后生成第一份报告</h2><p>报告生成前会单独确认费用，生成后关联对话只读。</p><a href="{{ url_for('web.workspace', view='jobs') }}">添加目标岗位</a></div>{% endfor %}</section>
