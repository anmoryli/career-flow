[project]
name = "career-flow"
version = "1.0.0"
description = "职序 CareerFlow V1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "flask-migrate>=4,<5",
    "flask-sqlalchemy>=3.1,<4",
    "flask-wtf>=1.2,<2",
    "gunicorn>=23,<24",
    "pydantic[email]>=2,<3",
    "pymysql[rsa]>=1.1,<2",
    "python-dotenv>=1,<2",
    "redis>=5,<8",
    "rq>=2,<3",
    "sqlalchemy>=2.0,<2.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires isolated MySQL 8.4 and Redis instances"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
